# Servers of the Atmos on-premise platform (fixed addresses from the Vagrantfile)
# and the Mac itself (localhost), which gets the *.atmos.lan entries in /etc/hosts.

all:
  children:
    servers:
      hosts:
        nexus-traefik:
          ansible_host: 192.168.0.53
        jenkins:
          ansible_host: 192.168.0.54
        k8s-cp:
          ansible_host: 192.168.0.51
        k8s-w1:
          ansible_host: 192.168.0.52
      vars:
        ansible_user: vagrant
        ansible_ssh_private_key_file: ~/.ssh/atmos_admin

    docker:
      hosts:
        nexus-traefik:
        jenkins:

    k3s_server:
      hosts:
        k8s-cp:

    k3s_agent:
      hosts:
        k8s-w1:

    k3s:
      children:
        k3s_server:
        k3s_agent:

    admin:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
