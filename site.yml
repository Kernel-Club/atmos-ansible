# Configures the Atmos on-premise platform. Run from the Mac:
#   ansible-playbook site.yml --ask-become-pass
#
# The order matters:
#   1. the Mac: names in /etc/hosts and the CA (Traefik and jenkins copy the CA files from the Mac);
#   2. common on all servers (firewall, metrics, registry name), then Docker;
#   3. Nexus before Traefik (Traefik routes to it), Traefik before Jenkins (Jenkins is reached through it);
#   4. the k3s server before the agent (the agent joins the server).
# Tags run one part only, for example: ansible-playbook site.yml --tags traefik

- name: Mac - names of the platform
  hosts: admin
  tags: mac
  become: true
  tasks:
    - name: Add the platform names to /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ATMOS (managed by Ansible)"
        block: |
          {% for entry in lan_names %}
          {{ hostvars[entry.host].ansible_host }} {{ entry.names | join(' ') }}
          {% endfor %}

- name: Mac - CA and server certificate
  hosts: admin
  tags: pki
  roles:
    - pki

- name: Servers - base configuration
  hosts: servers
  tags: common
  become: true
  roles:
    - common

- name: Servers outside the cluster - Docker
  hosts: docker
  tags: docker
  become: true
  roles:
    - docker

- name: nexus-traefik - Nexus
  hosts: nexus-traefik
  tags: nexus
  become: true
  roles:
    - nexus

- name: nexus-traefik - Traefik
  hosts: nexus-traefik
  tags: traefik
  become: true
  roles:
    - traefik

- name: jenkins - Jenkins
  hosts: jenkins
  tags: jenkins
  become: true
  roles:
    - jenkins

- name: Cluster - k3s server
  hosts: k3s_server
  tags: k3s
  become: true
  roles:
    - k3s

- name: Cluster - k3s agent
  hosts: k3s_agent
  tags: k3s
  become: true
  roles:
    - k3s
