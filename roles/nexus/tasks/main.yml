# Nexus Repository as a Docker container on nexus-traefik.

- name: Start the Nexus container
  community.docker.docker_container:
    name: "{{ nexus_container }}"
    image: "{{ nexus_image }}"
    restart_policy: unless-stopped
    published_ports:      # only on 127.0.0.1: ports published by Docker bypass ufw
      - "127.0.0.1:{{ nexus_http_port }}:8081"    # 8081: port of Nexus inside the container
      - "127.0.0.1:{{ nexus_registry_port }}:{{ nexus_registry_port }}"
    env:
      INSTALL4J_ADD_VM_PARAMS: "{{ nexus_jvm_options }}"
    volumes:
      - nexus-data:/nexus-data
    memory: "{{ nexus_memory_limit }}"

- name: Wait until Nexus is ready (the first start takes a few minutes)
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ nexus_http_port }}/service/rest/v1/status
    status_code: 200
  register: nexus_status
  check_mode: false   # read-only, so it also runs with --check
  until: nexus_status.status == 200
  retries: 36
  delay: 10
  changed_when: false

- name: Admin password and anonymous access
  ansible.builtin.import_tasks: admin.yml

- name: Docker repository and maintenance tasks
  ansible.builtin.import_tasks: repository.yml

- name: Roles and users
  ansible.builtin.import_tasks: users.yml
