# Admin password from Ansible Vault and no anonymous access.
# no_log: these tasks carry passwords, so Ansible does not print their arguments or results.

- name: Check whether the admin password from Ansible Vault is already set
  ansible.builtin.uri:
    url: "{{ nexus_api }}/security/anonymous"
    user: admin
    password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    status_code: [200, 401]
  register: nexus_admin_check
  check_mode: false   # read-only, so it also runs with --check
  no_log: true

- name: Replace the initial admin password (first start only)
  when: nexus_admin_check.status == 401
  block:
    - name: Read the initial admin password from the container
      ansible.builtin.command: docker exec {{ nexus_container }} cat /nexus-data/admin.password
      register: nexus_initial_password
      changed_when: false
      no_log: true

    - name: Set the admin password from Ansible Vault
      ansible.builtin.uri:
        url: "{{ nexus_api }}/security/users/admin/change-password"
        method: PUT
        user: admin
        password: "{{ nexus_initial_password.stdout }}"
        force_basic_auth: true
        headers:
          Content-Type: text/plain
        body: "{{ nexus_admin_password }}"
        status_code: 204
      changed_when: true
      no_log: true

    - name: Remove the initial password file
      ansible.builtin.command: docker exec {{ nexus_container }} rm -f /nexus-data/admin.password
      changed_when: true

- name: Read the anonymous access setting
  ansible.builtin.uri:
    url: "{{ nexus_api }}/security/anonymous"
    user: admin
    password: "{{ nexus_admin_password }}"
    force_basic_auth: true
  register: nexus_anonymous
  check_mode: false   # read-only, so it also runs with --check
  no_log: true

- name: Turn off anonymous access
  ansible.builtin.uri:
    url: "{{ nexus_api }}/security/anonymous"
    method: PUT
    user: admin
    password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      enabled: false
      userId: anonymous
      realmName: NexusAuthorizingRealm
  when: nexus_anonymous.json.enabled
  changed_when: true
  no_log: true
