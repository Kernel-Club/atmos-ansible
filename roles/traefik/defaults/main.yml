# Defaults of the traefik role (reverse proxy on traefik_host). Version in group_vars/all/versions.yml.

traefik_dir: /opt/traefik          # configuration and certificates, mounted read-only
traefik_container: traefik
traefik_image: traefik:{{ traefik_version }}
traefik_memory_limit: 128m
traefik_metrics_port: 9110         # the usual 8082 is taken by the Nexus registry on this server

# Upstreams
traefik_jenkins_url: http://{{ hostvars[jenkins_host].ansible_host }}:{{ jenkins_port }}
traefik_nexus_url: http://127.0.0.1:{{ nexus_http_port }}
traefik_registry_url: http://127.0.0.1:{{ nexus_registry_port }}

# Who may reach the registry port: Jenkins (push) and the cluster nodes (pull)
traefik_registry_clients: "{{ [jenkins_host] + groups['k3s'] }}"
