# Traefik as a Docker container in the host network on nexus-traefik.

- name: Create the Traefik directories
  ansible.builtin.file:
    path: "{{ traefik_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: ["", dynamic, certs]

- name: Copy the server certificate and key from the Mac
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ traefik_dir }}/certs/{{ item.src | basename }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ pki_server_cert }}", mode: "0644" }
    - { src: "{{ pki_server_key }}", mode: "0600" }
  loop_control:
    label: "{{ item.src | basename }}"
  notify: Restart Traefik

- name: Place the static configuration
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_dir }}/traefik.yml"
    mode: "0644"
  notify: Restart Traefik

- name: Place the routes (reloaded by Traefik itself)
  ansible.builtin.template:
    src: routes.yml.j2
    dest: "{{ traefik_dir }}/dynamic/routes.yml"
    mode: "0644"

- name: Start the Traefik container
  community.docker.docker_container:
    name: "{{ traefik_container }}"
    image: "{{ traefik_image }}"
    restart_policy: unless-stopped
    network_mode: host    # ports on the server itself, so ufw applies
    volumes:
      - "{{ traefik_dir }}/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "{{ traefik_dir }}/dynamic:/etc/traefik/dynamic:ro"
      - "{{ traefik_dir }}/certs:/etc/traefik/certs:ro"
    memory: "{{ traefik_memory_limit }}"

- name: Allow HTTP and HTTPS from the home network
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ item }}"
    src: "{{ home_network }}"
    comment: Traefik
  loop: ["80", "443"]

- name: Allow the registry port from Jenkins and the cluster nodes
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ registry_port | string }}"
    src: "{{ hostvars[item].ansible_host }}"
    comment: Docker registry (Traefik)
  loop: "{{ traefik_registry_clients }}"

- name: Allow the Traefik metrics port from the cluster nodes (Prometheus)
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ traefik_metrics_port | string }}"
    src: "{{ hostvars[item].ansible_host }}"
    comment: Traefik metrics for Prometheus
  loop: "{{ groups['k3s'] }}"
