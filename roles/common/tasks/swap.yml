# Brings the swap file of the box to common_swap_size_mb (0 = no swap).

- name: Read the swap file
  ansible.builtin.stat:
    path: "{{ common_swap_file }}"
  register: common_swap_stat

- name: Read the active swap
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: common_swap_active
  changed_when: false
  check_mode: false   # read-only, so it also runs with --check

- name: Set the swap facts
  ansible.builtin.set_fact:
    common_swap_wanted: "{{ common_swap_size_mb | int > 0 }}"
    common_swap_is_active: "{{ common_swap_file in common_swap_active.stdout_lines }}"
    common_swap_size_ok: "{{ common_swap_stat.stat.exists and common_swap_stat.stat.size == (common_swap_size_mb | int) * 1024 * 1024 }}"

- name: Turn off the swap file before it is removed or resized
  ansible.builtin.command: swapoff {{ common_swap_file }}
  when: common_swap_is_active and (not common_swap_wanted or not common_swap_size_ok)
  changed_when: true

- name: Remove the old swap file
  ansible.builtin.file:
    path: "{{ common_swap_file }}"
    state: absent
  when: not common_swap_wanted or not common_swap_size_ok

- name: Create the swap file
  when: common_swap_wanted and not common_swap_size_ok
  block:
    - name: Allocate the swap file
      ansible.builtin.command: fallocate -l {{ common_swap_size_mb }}M {{ common_swap_file }}
      changed_when: true

    - name: Restrict access to the swap file
      ansible.builtin.file:
        path: "{{ common_swap_file }}"
        mode: "0600"

    - name: Format the swap file
      ansible.builtin.command: mkswap {{ common_swap_file }}
      changed_when: true

- name: Turn on the swap file
  ansible.builtin.command: swapon {{ common_swap_file }}
  when: common_swap_wanted and (not common_swap_is_active or not common_swap_size_ok)
  changed_when: true

- name: Keep the swap file after a restart (/etc/fstab)
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^{{ common_swap_file }}\s'
    line: "{{ common_swap_file }} none swap sw 0 0"
    state: "{{ 'present' if common_swap_wanted else 'absent' }}"

- name: Use swap only under memory pressure
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ common_swappiness }}"
    sysctl_set: true
  when: common_swap_wanted
