# Trust of the private CA on the jenkins server: Docker (push to the registry) and the system (curl, other tools).

- name: Create the Docker certificate directory of the registry
  ansible.builtin.file:
    path: /etc/docker/certs.d/{{ registry_address }}
    state: directory
    mode: "0755"

- name: Trust the CA for the registry in Docker
  ansible.builtin.copy:
    src: "{{ pki_ca_cert }}"
    dest: /etc/docker/certs.d/{{ registry_address }}/ca.crt
    mode: "0644"

- name: Add the CA to the system trust store
  ansible.builtin.copy:
    src: "{{ pki_ca_cert }}"
    dest: /usr/local/share/ca-certificates/atmos-root-ca.crt
    mode: "0644"
  notify: Update the system CA certificates
