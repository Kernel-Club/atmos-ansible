# Jenkins platform from atmos-jenkins, built on the server and run as a Docker container in the host network.

- name: Create the Jenkins directory
  ansible.builtin.file:
    path: "{{ jenkins_dir }}"
    state: directory
    mode: "0755"

- name: Install git
  ansible.builtin.apt:
    name: git
    state: present

- name: Get the platform version from atmos-jenkins
  ansible.builtin.git:
    repo: "{{ jenkins_repo }}"
    dest: "{{ jenkins_src_dir }}"
    version: "{{ jenkins_platform_version }}"
  register: jenkins_src

- name: Name the image after the platform commit
  ansible.builtin.set_fact:
    jenkins_image: "atmos-jenkins:{{ jenkins_src.after[:12] }}"

- name: Build the Jenkins image (only when this commit has no image yet)
  community.docker.docker_image:
    name: "{{ jenkins_image }}"
    source: build
    build:
      path: "{{ jenkins_src_dir }}"

- name: Create the secrets directory
  ansible.builtin.file:
    path: "{{ jenkins_dir }}/secrets"
    state: directory
    owner: "1000"          # the jenkins user in the container
    mode: "0700"

- name: Place the secrets from Ansible Vault
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ jenkins_dir }}/secrets/{{ item.key }}"
    owner: "1000"
    mode: "0400"
  loop: "{{ jenkins_secrets | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  notify: Restart Jenkins

# Before the container starts: it mounts the registry CA of this server.
- name: Trust the private CA (registry and system)
  ansible.builtin.import_tasks: registry.yml

- name: Read the group of the Docker socket (builds run through it)
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: jenkins_docker_socket

- name: Start the Jenkins container
  community.docker.docker_container:
    name: "{{ jenkins_container }}"
    image: "{{ jenkins_image }}"
    restart_policy: unless-stopped
    network_mode: host    # the port is on the server itself, so ufw applies
    env:
      JAVA_OPTS: "{{ jenkins_java_opts }}"
      JENKINS_OPTS: "--httpPort={{ jenkins_port }}"
      # Address of atmos.lan for the containers of develop-cd-checks (no DNS server in the home network).
      ATMOS_APP_ADDRESS: "{{ hostvars[app_host].ansible_host }}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - "{{ jenkins_dir }}/secrets:/run/secrets:ro"   # read by JCasC as ${NAME}
      - /var/run/docker.sock:/var/run/docker.sock     # Docker of this server: build containers
      - /etc/docker/certs.d:/etc/docker/certs.d:ro    # the Docker CLI trusts the registry CA too
    groups:
      - "{{ jenkins_docker_socket.stat.gid }}"        # the jenkins user may use the socket
    memory: "{{ jenkins_memory_limit }}"
  register: jenkins_container_result

- name: Wait until Jenkins answers
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ jenkins_port }}/login
    status_code: [200, 403]
  register: jenkins_status
  check_mode: false   # read-only, so it also runs with --check
  until: jenkins_status.status in [200, 403]
  retries: 30
  delay: 10
  changed_when: false

# Jenkins lists the job folders before JCasC creates the jobs, so a job created at the first
# start of a new container is loaded only at the next start: restart once, then wait again.
- name: Restart Jenkins once after the container was created
  community.docker.docker_container:
    name: "{{ jenkins_container }}"
    state: started
    restart: true
  when: jenkins_container_result is changed

- name: Wait until Jenkins answers after the restart
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ jenkins_port }}/login
    status_code: [200, 403]
  register: jenkins_status
  check_mode: false   # read-only, so it also runs with --check
  until: jenkins_status.status in [200, 403]
  retries: 30
  delay: 10
  changed_when: false
  when: jenkins_container_result is changed

- name: Allow the Jenkins port only from Traefik
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ jenkins_port | string }}"
    src: "{{ hostvars[traefik_host].ansible_host }}"
    comment: Jenkins through Traefik
