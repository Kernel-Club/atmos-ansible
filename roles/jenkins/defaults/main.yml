# Defaults of the jenkins role: deploys the Jenkins platform from the atmos-jenkins repository.
# Version of the platform in group_vars/all/versions.yml.

jenkins_dir: /opt/jenkins
jenkins_src_dir: "{{ jenkins_dir }}/platform"
jenkins_repo: https://github.com/Kernel-Club/atmos-jenkins.git

# Memory: container limit and JVM heap inside it. Image builds run in separate containers.
jenkins_memory_limit: 1g
jenkins_java_opts: -Xmx768m
