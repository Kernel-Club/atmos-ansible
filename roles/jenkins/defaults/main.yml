# Defaults of the jenkins role (install only; the Jenkins platform configuration is in US-03).
# Version in group_vars/all/versions.yml.

jenkins_dir: /opt/jenkins
jenkins_image: jenkins/jenkins:{{ jenkins_version }}
jenkins_port: 8080

# Memory: container limit and JVM heap inside it. Image builds run in separate containers.
jenkins_memory_limit: 1g
jenkins_java_opts: -Xmx768m
