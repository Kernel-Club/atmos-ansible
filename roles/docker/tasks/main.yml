# Docker Engine from the official Docker repository, pinned versions. Containers are run by Ansible (no Compose).

- name: Remove the Docker packages of Ubuntu (they conflict with the official ones)
  ansible.builtin.apt:
    name: [docker.io, docker-compose, docker-compose-v2, docker-doc, podman-docker, containerd, runc]
    state: absent

- name: Add the official Docker repository
  tags: docker_repo
  block:
    - name: Install python3-debian (needed by the deb822_repository module)
      ansible.builtin.apt:
        name: python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Download the key of the Docker repository
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add the Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: amd64
        signed_by: /etc/apt/keyrings/docker.asc
      register: docker_repo

    - name: Update the apt cache after the repository was added
      ansible.builtin.apt:
        update_cache: true
      when: docker_repo is changed

- name: Install Docker Engine {{ docker_version }}
  ansible.builtin.apt:
    name:
      - docker-ce={{ docker_version }}
      - docker-ce-cli={{ docker_version }}
      - containerd.io={{ docker_containerd_version }}
      - docker-buildx-plugin={{ docker_buildx_version }}
    state: present
    install_recommends: false   # otherwise apt also installs the Compose plugin, which is not used
    update_cache: true
    cache_valid_time: 3600
    allow_change_held_packages: true   # a new pinned version replaces the held one

- name: Hold the Docker packages at the pinned versions (no upgrade by apt upgrade)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ docker_packages }}"

- name: Configure the Docker daemon
  ansible.builtin.copy:
    content: "{{ docker_daemon_options | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart Docker

- name: Start Docker and enable it at boot
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Allow the Docker metrics port from the cluster nodes (Prometheus)
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ docker_metrics_port | string }}"
    src: "{{ hostvars[item].ansible_host }}"
    comment: Docker metrics for Prometheus
  loop: "{{ groups['k3s'] }}"
