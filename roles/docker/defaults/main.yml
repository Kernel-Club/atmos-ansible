# Defaults of the docker role. Versions are pinned in group_vars/all/versions.yml.

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin

# /etc/docker/daemon.json: rotate container logs, so they cannot fill the disk.
docker_daemon_options:
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "3"
